<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>carrossel</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EDE6D6; --cream-2:#F2EDE1; --ink:#111111; --orange:#E8451F;
    --muted:#6b6a66;
    --grid:rgba(17,17,17,.075); --grid-major:rgba(17,17,17,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff}

  .slide{
    width:1080px;height:1350px;background:var(--cream);color:var(--ink);
    position:relative;overflow:hidden;
    background-image:
      linear-gradient(var(--grid-major) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:180px 180px,180px 180px,36px 36px,36px 36px;
    padding:78px 78px 62px;display:flex;flex-direction:column;
    font-family:Inter,system-ui,sans-serif;
  }
  .slide.plain{
    background-image:
      linear-gradient(rgba(17,17,17,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(17,17,17,.10) 1px,transparent 1px),
      linear-gradient(rgba(17,17,17,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(17,17,17,.05) 1px,transparent 1px);
    background-size:180px 180px,180px 180px,36px 36px,36px 36px;
  }

  .crop{position:absolute;width:34px;height:34px;pointer-events:none}
  .crop::before,.crop::after{content:'';position:absolute;background:var(--orange)}
  .crop::before{left:0;top:16px;width:34px;height:2px}
  .crop::after{top:0;left:16px;width:2px;height:34px}
  .crop.tl{top:30px;left:30px}.crop.tr{top:30px;right:30px}
  .crop.bl{bottom:30px;left:30px}.crop.br{bottom:30px;right:30px}

  .head{display:flex;align-items:center;gap:20px;margin-bottom:8px}
  .chip{background:var(--ink);color:#fff;font:500 20px/1 'IBM Plex Mono',monospace;
        letter-spacing:.22em;padding:14px 20px;white-space:nowrap}
  .rule{flex:1;display:flex;align-items:center;gap:14px;color:var(--muted);
        font:400 18px 'IBM Plex Mono',monospace;letter-spacing:.18em}
  .rule .line{flex:1;height:1px;background:rgba(17,17,17,.35)}
  .rev{color:var(--orange);font:500 20px 'IBM Plex Mono',monospace;letter-spacing:.2em}

  h1.display{font-family:Anton,sans-serif;font-weight:400;line-height:.86;
     letter-spacing:-.02em;text-transform:uppercase;transform:scaleX(.94);
     transform-origin:left;margin-top:40px;white-space:nowrap}

  .figcap{margin-top:34px}
  .figcap .bar-o{width:640px;height:2px;background:var(--orange);position:relative;margin-bottom:16px}
  .figcap .bar-o::before,.figcap .bar-o::after{content:'';position:absolute;top:-7px;width:2px;height:16px;background:var(--orange)}
  .figcap .bar-o::before{left:0}.figcap .bar-o::after{right:0}
  .figcap p{color:var(--orange);font:400 22px 'IBM Plex Mono',monospace;letter-spacing:.08em}

  .body{margin-top:34px;font-size:37px;line-height:1.34;font-weight:600;max-width:960px}
  .body em{font-style:normal;color:var(--orange);font-weight:700}
  .body strong{font-weight:800}
  .spacer{flex:1}
  /* texto sozinho: sem imagem nem bloco, o spacer empurrava tudo para cima e
     sobrava meio slide vazio. Centralizado, o vazio vira respiro proposital. */
  .slide.solo .body{font-size:44px;line-height:1.3}
  .slide.solo .spacer{flex:0}
  .slide.solo .fill{flex:1;display:flex;align-items:center}

  .listbox{border:2px solid var(--ink);background:var(--cream-2);padding:8px 44px;flex:none}
  .listbox .row{display:flex;gap:34px;align-items:center;padding:38px 0;border-bottom:1px solid rgba(17,17,17,.18)}
  .listbox .row:last-child{border-bottom:0}
  .listbox .n{color:var(--orange);font:400 30px 'IBM Plex Mono',monospace;width:52px;flex:none}
  .listbox .t{font-family:Anton,sans-serif;font-size:52px;line-height:1;text-transform:uppercase;width:300px;flex:none}
  .listbox .d{font-size:29px;line-height:1.32;color:#4a4844}

  .cards{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;flex:none}
  .card{padding:44px 42px;min-height:390px}
  .card.dark{background:var(--ink);color:#efe9dc;box-shadow:14px 14px 0 rgba(17,17,17,.14)}
  .card.out{border:2px solid var(--orange)}
  .card .lbl{font:400 21px 'IBM Plex Mono',monospace;letter-spacing:.18em;margin-bottom:18px;color:var(--orange)}
  .card h3{font-family:Anton,sans-serif;font-weight:400;font-size:64px;line-height:1;text-transform:uppercase;margin-bottom:24px}
  .card p{font-size:29px;line-height:1.36;color:#4a4844}
  .card.dark p{color:#a8a49b}
  .arrow{display:flex;justify-content:center;color:var(--orange);font-size:54px}

  .checks{border:2px solid var(--ink);background:var(--cream-2);padding:34px 38px;flex:none}
  .checks .lbl{color:var(--orange);font:400 21px 'IBM Plex Mono',monospace;letter-spacing:.16em;margin-bottom:12px}
  .checks .c{display:flex;align-items:center;gap:20px;padding:26px 0;border-bottom:1px solid rgba(17,17,17,.15);font-size:31px;font-weight:600}
  .checks .c:last-child{border-bottom:0}
  .checks .dot{width:38px;height:38px;border-radius:50%;background:var(--orange);color:#fff;
               display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}

  .imgwrap{margin-top:8px;flex:none}
  .imgframe{position:relative;padding:14px}
  .imgframe img{width:100%;display:block}
  .imgframe .k{position:absolute;width:30px;height:30px;border:3px solid var(--orange)}
  .imgframe .k.a{top:0;left:0;border-right:0;border-bottom:0}
  .imgframe .k.b{top:0;right:0;border-left:0;border-bottom:0}
  .imgframe .k.c{bottom:0;left:0;border-right:0;border-top:0}
  .imgframe .k.d{bottom:0;right:0;border-left:0;border-top:0}
  .imgcap{color:var(--orange);font:400 21px 'IBM Plex Mono',monospace;letter-spacing:.12em;margin-bottom:14px}

  /* rodape: paginacao + @ do perfil (marca d'agua anti-plagio) */
  .foot{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);
        font:400 22px 'IBM Plex Mono',monospace;letter-spacing:.22em;margin-top:44px}
  .foot .left{display:flex;align-items:baseline;gap:22px}
  .foot .handle{color:var(--orange);font-size:19px;letter-spacing:.14em;opacity:.95}

  /* capa — tipografia pura, sem arte gerada */
  .cover{padding:70px 66px 56px}
  .cover .topspec,.cover .botspec{display:flex;justify-content:space-between;
        font:400 20px/1.7 'IBM Plex Mono',monospace;letter-spacing:.13em;color:#3c3a36}
  .cover .botspec{margin-top:auto}
  .cover .topspec .r,.cover .botspec .r{text-align:right}
  .cover .ruler{display:flex;align-items:center;gap:16px;margin:16px 0 0;
        color:#3c3a36;font:400 20px 'IBM Plex Mono',monospace;letter-spacing:.2em}
  .cover .ruler .line{flex:1;height:1px;background:rgba(17,17,17,.45);position:relative}
  .cover .ruler .line::before,.cover .ruler .line::after{content:'';position:absolute;top:-7px;width:1px;height:15px;background:rgba(17,17,17,.45)}
  .cover .ruler .line::before{left:0}.cover .ruler .line::after{right:0}
  .cover .headline{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .cover h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;
        line-height:.92;letter-spacing:-.015em;text-align:center;transform:scaleX(.96)}
  .cover .band{background:var(--orange);color:#fff;padding:6px 24px 18px;margin:10px 0;
        box-shadow:10px 10px 0 rgba(17,17,17,.13)}
  .cover .pill{border:3px solid var(--ink);border-radius:999px;background:var(--cream-2);
        padding:24px 50px;display:flex;align-items:center;gap:22px;align-self:center;
        margin-bottom:34px;box-shadow:8px 8px 0 rgba(17,17,17,.12);max-width:900px}
  .cover .pill .tri{color:var(--orange);font-size:32px;flex:none}
  .cover .pill span{font-size:42px;font-weight:800;letter-spacing:-.01em}
</style>
<style id="theme"></style>
</head>
<body>
<div id="stage"></div>
<script>
const esc = s => String(s == null ? '' : s);
let HANDLE = '';

const crops = `<div class="crop tl"></div><div class="crop tr"></div><div class="crop bl"></div><div class="crop br"></div>`;

function head(chip){
  return `<div class="head"><div class="chip">${esc(chip)}</div>
    <div class="rule"><span class="line"></span>1080 PX<span class="line"></span></div>
    <div class="rev">REV A ▲</div></div>`;
}
function fig(t){ return t ? `<div class="figcap"><div class="bar-o"></div><p>${esc(t)}</p></div>` : ''; }
function bodies(arr){ return (arr||[]).map(b => `<p class="body">${b}</p>`).join(''); }

function image(s){
  if(!s.image) return '';
  return `<div class="imgwrap">
    ${s.imageCaption ? `<div class="imgcap">${esc(s.imageCaption)}</div>` : ''}
    <div class="imgframe"><span class="k a"></span><span class="k b"></span><span class="k c"></span><span class="k d"></span>
    <img src="${esc(s.image)}" onerror="this.closest('.imgwrap').remove()"></div></div>`;
}

// paginacao a esquerda + @ do perfil colado nela; "swipe" some no ultimo slide
function foot(sheet){
  const last = /(\d+)\s*\/\s*\1/.test(sheet || '');
  return `<div class="foot">
    <span class="left"><span>${esc(sheet)}</span><span class="handle">${esc(HANDLE)}</span></span>
    <span>${last ? '' : 'SWIPE →'}</span></div>`;
}

function renderCover(s){
  // 3 linhas no maximo; a fonte cai conforme a linha mais longa, para nunca quebrar
  const longest = Math.max(...s.lines.map(l => l.text.length), 1);
  const fs = longest <= 9 ? 168 : longest <= 11 ? 146 : longest <= 13 ? 126 : 108;
  const lines = s.lines.map(l =>
    l.band ? `<div class="band">${esc(l.text)}</div>` : `<div>${esc(l.text)}</div>`).join('');
  return `<div class="slide plain cover">
    <div class="topspec"><div>${(s.specTop||[]).map(esc).join('<br>')}</div>
      <div class="r">${(s.specTopRight||[]).map(esc).join('<br>')}</div></div>
    <div class="ruler"><span class="line"></span>1080 PX<span class="line"></span></div>
    <div class="headline"><h1 style="font-size:${fs}px">${lines}</h1></div>
    <div class="pill"><span class="tri">▶</span><span>${esc(s.pill)}</span></div>
    <div class="botspec"><div>${(s.specBot||[]).map(esc).join('<br>')}</div>
      <div class="r">${(s.specBotRight||[]).map(esc).join('<br>')}</div></div>
  </div>`;
}

function renderContent(s){
  let block = '';
  if(s.type === 'list' && s.items){
    block = `<div class="listbox">${s.items.map(i =>
      `<div class="row"><div class="n">${esc(i.n)}</div><div class="t">${esc(i.t)}</div>
       <div class="d">${esc(i.d)}</div></div>`).join('')}</div>`;
  }
  if(s.type === 'cards' && s.cards){
    const c = s.cards;
    block = `<div class="cards">
      <div class="card ${esc(c[0].style||'dark')}"><div class="lbl">${esc(c[0].lbl)}</div>
        <h3>${esc(c[0].h)}</h3><p>${esc(c[0].p)}</p></div>
      <div class="arrow">→</div>
      <div class="card ${esc(c[1].style||'out')}"><div class="lbl">${esc(c[1].lbl)}</div>
        <h3>${esc(c[1].h)}</h3><p>${esc(c[1].p)}</p></div></div>`;
  }
  if(s.type === 'checks' && s.checks){
    block = `<div class="checks"><div class="lbl">${esc(s.checksLabel||'')}</div>${
      s.checks.map(c => `<div class="c"><span class="dot">✓</span>${esc(c)}</div>`).join('')}</div>`;
  }
  const solo = !block && !s.image;
  const n = (s.title || '').length;
  const fs = n <= 9 ? 180 : n <= 11 ? 156 : n <= 13 ? 132 : n <= 15 ? 114 : 100;
  if(solo){
    return `<div class="slide solo">${crops}${head(s.chip)}
      <h1 class="display" style="font-size:${fs}px">${esc(s.title)}</h1>
      ${fig(s.fig)}<div class="fill"><div>${bodies(s.body)}</div></div>
      ${foot(s.sheet)}</div>`;
  }
  return `<div class="slide">${crops}${head(s.chip)}
    <h1 class="display" style="font-size:${fs}px">${esc(s.title)}</h1>
    ${fig(s.fig)}${bodies(s.body)}<div class="spacer"></div>
    ${image(s)}${block}${foot(s.sheet)}</div>`;
}


const THEMES = {
  blueprint: '',

  dark: `
:root{--orange:#ff5a2a;--ink:#f2ede1;--cream:#12110f;--cream-2:#1c1a17;--muted:#8c8578;
      --grid:rgba(255,255,255,.04);--grid-major:rgba(255,255,255,.08)}
.chip{background:var(--ink);color:#12110f}
.imgframe img{border:1px solid rgba(255,255,255,.15);background:var(--cream-2)}
.listbox,.checks{background:var(--cream-2);border-color:rgba(255,255,255,.18)}
.listbox .row,.checks .c{border-color:rgba(255,255,255,.12)}
.listbox .d{color:#a39d90}
.card.dark{background:var(--ink);color:#12110f;box-shadow:14px 14px 0 rgba(0,0,0,.28)}
.card.dark p{color:#4a4740}
.card p{color:#a39d90}
.cover .topspec,.cover .botspec,.cover .ruler{color:#a39d90}
.cover .pill{background:var(--cream-2);border-color:var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.28)}
.cover .band{box-shadow:10px 10px 0 rgba(0,0,0,.28)}
`,

  minimal: `
:root{--orange:#e8481f;--ink:#0d0d0d;--cream:#ffffff;--cream-2:#ffffff;--muted:#9a9a9a;
      --grid:transparent;--grid-major:transparent}
.slide{padding:96px 96px 76px}
.crop{display:none}
.chip{background:transparent;color:var(--muted);padding:0;
      font:500 20px 'IBM Plex Mono',monospace;letter-spacing:.24em}
.rule .line{display:none}
.rule{flex:1;justify-content:flex-end;white-space:nowrap;gap:18px}
.rev{color:var(--muted);font-size:19px;white-space:nowrap}
.figcap .bar-o{width:64px;height:3px}
.figcap .bar-o::before,.figcap .bar-o::after{display:none}
.figcap p{color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:21px}
.body{font-weight:500;color:#1a1a1a}
.imgframe{padding:0}
.imgframe .k{display:none}
.imgframe img{border:0}
.listbox,.checks{border:0;background:transparent;padding:0}
.listbox .row{border-bottom:1px solid #e2e2e2}
.listbox .row:first-child{border-top:1px solid #e2e2e2}
.listbox .d{color:#6e6e6e}
.card{background:transparent;border:0;box-shadow:none;padding:34px 0 0}
.card.dark{background:transparent;color:var(--ink);border-top:4px solid var(--ink);box-shadow:none}
.card.out{border:0;border-top:4px solid var(--orange)}
.card p,.card.dark p{color:#6e6e6e}
.arrow{color:var(--muted)}
.foot{border-top:1px solid #e2e2e2;padding-top:26px;color:var(--muted)}
.cover .ruler{display:none}
.cover .pill{background:transparent;box-shadow:none}
.cover .band{box-shadow:none}
`,

  editorial: `
:root{--orange:#ff5a2a;--ink:#ffffff;--cream:#0a0a0a;--cream-2:rgba(255,255,255,.08);
      --muted:rgba(255,255,255,.66);--grid:transparent;--grid-major:transparent}
.slide{position:relative;isolation:isolate}
.slide:not(:has(.imgframe)){background:
  radial-gradient(120% 90% at 85% 0%,rgba(255,90,42,.15) 0%,transparent 55%),#0a0a0a}
.crop{display:none}
.imgframe{position:absolute;inset:0;padding:0;margin:0;z-index:-2}
.imgframe img{width:100%;height:100%;max-height:none;object-fit:cover;border:0;display:block}
.imgframe .k,.imgcap{display:none}
.slide:has(.imgframe)::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(10,10,10,.9) 0%,rgba(10,10,10,.55) 38%,
                              rgba(10,10,10,.8) 72%,rgba(10,10,10,.97) 100%)}
.chip{background:var(--orange);color:#0a0a0a;font-weight:800}
.rev{color:#fff}
h1.display,.cover h1{color:#fff;text-shadow:0 2px 24px rgba(10,10,10,.6)}
.figcap .bar-o{background:var(--orange);width:120px}
.figcap .bar-o::before,.figcap .bar-o::after{display:none}
.figcap p{color:#fff;opacity:.86}
.body{color:#fff;text-shadow:0 1px 16px rgba(10,10,10,.5)}
.listbox,.checks,.card{background:rgba(10,10,10,.58);border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.listbox .row,.checks .c{border-color:rgba(255,255,255,.15)}
.listbox .t,.card h3{color:#fff}
.listbox .d,.card p{color:var(--muted)}
.card.dark{background:var(--orange);color:#0a0a0a;border-color:var(--orange)}
.card.dark h3{color:#0a0a0a}
.card.dark p{color:rgba(10,10,10,.85)}
.arrow{color:#fff}
.foot{color:rgba(255,255,255,.72)}
.cover .topspec,.cover .botspec,.cover .ruler{color:rgba(255,255,255,.72)}
.cover .band{background:var(--orange);color:#0a0a0a;box-shadow:none}
.cover .pill{background:rgba(10,10,10,.58);border-color:#fff;color:#fff;box-shadow:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
`,
};
window.THEMES = THEMES;

window.mount = function(deck){
  HANDLE = deck.handle || '';
  const tema = String(deck.template || 'blueprint').toLowerCase();
  document.getElementById('theme').textContent = THEMES[tema] || '';
  document.getElementById('stage').innerHTML =
    (deck.slides || []).map(s => s.type === 'cover' ? renderCover(s) : renderContent(s)).join('');
  return document.querySelectorAll('.slide').length;
};
</script>
</body>
</html>
